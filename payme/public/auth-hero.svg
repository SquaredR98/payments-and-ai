<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" fill="none">
  <!-- Background gradient — deep slate to lighter -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="200" x2="400" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="800" height="1200" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="500" rx="500" ry="400" fill="url(#glow)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.04" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="1200"/><line x1="80" y1="0" x2="80" y2="1200"/>
    <line x1="160" y1="0" x2="160" y2="1200"/><line x1="240" y1="0" x2="240" y2="1200"/>
    <line x1="320" y1="0" x2="320" y2="1200"/><line x1="400" y1="0" x2="400" y2="1200"/>
    <line x1="480" y1="0" x2="480" y2="1200"/><line x1="560" y1="0" x2="560" y2="1200"/>
    <line x1="640" y1="0" x2="640" y2="1200"/><line x1="720" y1="0" x2="720" y2="1200"/>
    <line x1="800" y1="0" x2="800" y2="1200"/>
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="640" x2="800" y2="640"/><line x1="0" y1="720" x2="800" y2="720"/>
    <line x1="0" y1="800" x2="800" y2="800"/><line x1="0" y1="880" x2="800" y2="880"/>
    <line x1="0" y1="960" x2="800" y2="960"/><line x1="0" y1="1040" x2="800" y2="1040"/>
    <line x1="0" y1="1120" x2="800" y2="1120"/>
  </g>

  <!-- Floating decorative circles -->
  <circle cx="650" cy="150" r="60" fill="#38BDF8" opacity="0.06"/>
  <circle cx="150" cy="950" r="80" fill="#818CF8" opacity="0.05"/>
  <circle cx="700" cy="800" r="40" fill="#38BDF8" opacity="0.04"/>

  <!-- Main invoice card (tilted slightly) -->
  <g transform="translate(400, 420) rotate(-3)">
    <rect x="-200" y="-170" width="400" height="340" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Card header -->
    <rect x="-200" y="-170" width="400" height="56" rx="16" fill="#334155" opacity="0.5"/>
    <rect x="-200" y="-130" width="400" height="16" fill="#334155" opacity="0.5"/>
    <!-- Logo placeholder -->
    <circle cx="-168" cy="-142" r="14" fill="url(#accent)"/>
    <rect x="-148" y="-150" width="80" height="8" rx="4" fill="#CBD5E1" opacity="0.5"/>
    <rect x="-148" y="-138" width="50" height="6" rx="3" fill="#64748B" opacity="0.4"/>
    <!-- Invoice label -->
    <rect x="100" y="-155" width="72" height="24" rx="12" fill="#38BDF8" opacity="0.12"/>
    <rect x="112" y="-148" width="48" height="10" rx="5" fill="#38BDF8" opacity="0.5"/>
    <!-- Line items -->
    <rect x="-172" y="-80" width="140" height="8" rx="4" fill="#475569" opacity="0.6"/>
    <rect x="100" y="-80" width="60" height="8" rx="4" fill="#CBD5E1" opacity="0.3"/>
    <line x1="-172" y1="-58" x2="172" y2="-58" stroke="#334155" stroke-width="1"/>
    <rect x="-172" y="-40" width="120" height="8" rx="4" fill="#475569" opacity="0.6"/>
    <rect x="100" y="-40" width="60" height="8" rx="4" fill="#CBD5E1" opacity="0.3"/>
    <line x1="-172" y1="-18" x2="172" y2="-18" stroke="#334155" stroke-width="1"/>
    <rect x="-172" y="0" width="100" height="8" rx="4" fill="#475569" opacity="0.6"/>
    <rect x="100" y="0" width="60" height="8" rx="4" fill="#CBD5E1" opacity="0.3"/>
    <line x1="-172" y1="22" x2="172" y2="22" stroke="#334155" stroke-width="1"/>
    <!-- Total -->
    <rect x="-172" y="50" width="60" height="10" rx="5" fill="#64748B" opacity="0.5"/>
    <rect x="80" y="44" width="92" height="22" rx="6" fill="#38BDF8" opacity="0.15"/>
    <rect x="92" y="50" width="68" height="10" rx="5" fill="#38BDF8" opacity="0.7"/>
    <!-- Pay button -->
    <rect x="-172" y="100" width="344" height="44" rx="10" fill="url(#accent)"/>
    <rect x="-40" y="115" width="80" height="12" rx="6" fill="white" opacity="0.9"/>
  </g>

  <!-- Floating payment method card (behind, offset) -->
  <g transform="translate(280, 680) rotate(5)" opacity="0.7">
    <rect x="-120" y="-75" width="240" height="150" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- Chip -->
    <rect x="-90" y="-45" width="36" height="26" rx="5" fill="#FBBF24" opacity="0.3"/>
    <rect x="-84" y="-39" width="24" height="14" rx="3" fill="#FBBF24" opacity="0.15"/>
    <!-- Card number dots -->
    <g fill="#64748B" opacity="0.5">
      <circle cx="-80" cy="10" r="3"/><circle cx="-68" cy="10" r="3"/><circle cx="-56" cy="10" r="3"/><circle cx="-44" cy="10" r="3"/>
      <circle cx="-20" cy="10" r="3"/><circle cx="-8" cy="10" r="3"/><circle cx="4" cy="10" r="3"/><circle cx="16" cy="10" r="3"/>
      <circle cx="40" cy="10" r="3"/><circle cx="52" cy="10" r="3"/><circle cx="64" cy="10" r="3"/><circle cx="76" cy="10" r="3"/>
    </g>
    <rect x="-80" y="35" width="70" height="7" rx="3.5" fill="#475569" opacity="0.4"/>
    <rect x="60" y="35" width="40" height="7" rx="3.5" fill="#475569" opacity="0.4"/>
  </g>

  <!-- Floating success checkmark badge -->
  <g transform="translate(560, 320)">
    <circle r="28" fill="#10B981" opacity="0.15"/>
    <circle r="18" fill="#10B981" opacity="0.25"/>
    <path d="M-7 0 L-2 5 L7 -4" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating dollar sign -->
  <g transform="translate(200, 280)" opacity="0.6">
    <circle r="24" fill="#38BDF8" opacity="0.1"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#38BDF8" opacity="0.5">$</text>
  </g>

  <!-- Small floating dots (decoration) -->
  <circle cx="130" cy="450" r="4" fill="#38BDF8" opacity="0.3"/>
  <circle cx="670" cy="550" r="3" fill="#818CF8" opacity="0.25"/>
  <circle cx="100" cy="700" r="5" fill="#38BDF8" opacity="0.15"/>
  <circle cx="680" cy="380" r="3" fill="#818CF8" opacity="0.2"/>
  <circle cx="350" cy="850" r="4" fill="#38BDF8" opacity="0.12"/>

  <!-- Bottom fade -->
  <rect y="1000" width="800" height="200" fill="url(#bg)" opacity="0.8"/>
</svg>
